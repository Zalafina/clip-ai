name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0; leave empty to use Cargo.toml version)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package zip archive and checksums
        id: package
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag_name }}".Trim() -ne "") {
            $tag = "${{ inputs.tag_name }}".Trim()
          } else {
            $toml = Get-Content "Cargo.toml" -Raw
            if ($toml -match '(?m)^version\s*=\s*"([^"]+)"') {
              $tag = "v$($Matches[1])"
            } else {
              throw "Failed to detect version from Cargo.toml"
            }
          }

          $stage = "dist/package"
          $assets = "dist/assets"
          New-Item -ItemType Directory -Force -Path $stage, $assets | Out-Null

          $exePath = "target/x86_64-pc-windows-msvc/release/clip-ai.exe"
          if (-not (Test-Path $exePath)) {
            throw "Release binary not found at $exePath"
          }

          Copy-Item $exePath "$stage/clip-ai.exe" -Force
          Copy-Item "README.md" "$stage/README.md" -Force
          Copy-Item "LICENSE" "$stage/LICENSE" -Force

          $zipName = "clip-ai-$tag-x86_64-windows.zip"
          $zipPath = Join-Path $assets $zipName
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Out-File -FilePath (Join-Path $assets "SHA256SUMS.txt") -Encoding ascii

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: clip-ai ${{ steps.package.outputs.tag }}
          generate_release_notes: true
          files: dist/assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
